name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches package version
        run: >-
          node -e "const p=require('./package.json');
          const expected='v'+p.version;
          if(process.env.GITHUB_REF_NAME!==expected){throw new Error('Expected release tag '+expected+', received '+process.env.GITHUB_REF_NAME)}"

      - name: Verify release
        run: pnpm run check

      - name: Verify packed package in an isolated consumer
        run: pnpm run test:pack

      - name: Publish with npm trusted publishing
        run: |
          package_version=$(node -p "const p=require('./package.json'); p.name+'@'+p.version")
          if npm view "$package_version" version >/dev/null 2>&1; then
            echo "$package_version is already published; nothing to do."
          else
            npm publish
          fi
